<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Let's Talk AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-box {
      width: 95%;
      max-width: 650px;
      height: 90vh;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 26px;
    }

    .header p {
      margin-top: 5px;
      opacity: 0.8;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .user {
      justify-content: flex-end;
    }

    .bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 15px;
      color: white;
      line-height: 1.5;
    }

    .user .bubble {
      background: #6366f1;
      border-bottom-right-radius: 3px;
    }

    .bot .bubble {
      background: #334155;
      border-bottom-left-radius: 3px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111827;
    }

    #input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 16px;
    }

    #input::placeholder {
      color: #94a3b8;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4f46e5;
    }
  </style>
</head>

<body>

  <div class="chat-box">

    <div class="header">
      <h1>🤖 Let's Talk AI</h1>
      <p>Your friendly AI chatbot</p>
    </div>

    <div id="chat">

      <div class="message bot">
        <div class="bubble">
          Hello! 👋 I'm Let's Talk AI.<br>
          Ask me anything!
        </div>
      </div>

    </div>

    <div class="input-box">
      <input
        id="input"
        type="text"
        placeholder="Type your message..."
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>

    function addMessage(message, type) {

      const chat = document.getElementById("chat");

      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.textContent = message;

      messageDiv.appendChild(bubble);
      chat.appendChild(messageDiv);

      chat.scrollTop = chat.scrollHeight;
    }


    function getAIResponse(message) {

      const text = message.toLowerCase();

      if (text.includes("hello") ||
          text.includes("hi") ||
          text.includes("hey")) {

        return "Hello! 👋 Nice to meet you. How can I help?";
      }

      if (text.includes("how are you")) {

        return "I'm doing great! 🤖 Thanks for asking.";
      }

      if (text.includes("your name")) {

        return "My name is Let's Talk AI.";
      }

      if (text.includes("who are you")) {

        return "I'm Let's Talk AI, your simple AI chatbot.";
      }

      if (text.includes("time")) {

        return "The current time is " +
          new Date().toLocaleTimeString();
      }

      if (text.includes("date")) {

        return "Today's date is " +
          new Date().toLocaleDateString();
      }

      if (text.includes("bye")) {

        return "Goodbye! 👋 Have a great day!";
      }

      return "That's interesting! 🤔 Tell me more about that.";
    }


    function sendMessage() {

      const input = document.getElementById("input");

      const message = input.value.trim();

      if (message === "") {
        return;
      }

      // Show user message
      addMessage(message, "user");

      input.value = "";

      // Simulate AI thinking
      setTimeout(function() {

        const response = getAIResponse(message);

        addMessage(response, "bot");

      }, 500);
    }


    // Press Enter to send
    document.getElementById("input").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
